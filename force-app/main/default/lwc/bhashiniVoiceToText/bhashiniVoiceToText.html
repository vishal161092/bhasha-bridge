<template>
    <div class="speech-to-text slds-p-top_medium">
        <span class="slds-text-heading_small slds-p-right_small">{labelName}</span>
        <lightning-icon icon-name="utility:unmuted" onclick={startRecording} title="Start" size="small" class="recorder-icon"></lightning-icon>
        <lightning-icon icon-name="utility:muted" onclick={stopRecording} title="Stop" size="small" class="recorder-icon"></lightning-icon>

        <template if:false={textBox}>
            <lightning-input type="text" value={transcriptionText}></lightning-input>
        </template>
        <template if:true={textBox}>
            <lightning-textarea value={transcriptionText}></lightning-textarea>
        </template>
    </div>
</template>
